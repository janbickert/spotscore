<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="author" content="Jan Bickert">
  <meta name="description" content="Rate your Spotify liked songs and albums, derive artist scores, and compare them in head-to-heads and brackets.">
  <meta name="theme-color" content="#191514">
  <title>SpotScore</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <button id="back" class="icon-btn" aria-label="Back" hidden>‹</button>
  </header>

  <main id="view" aria-live="polite"></main>

  <div id="player" class="player" hidden></div>

  <nav class="tabbar" aria-label="Main">
    <a href="#/library" data-tab="library"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h3v16H4zM9.5 4h3v16h-3zM15 5l2.9-.8 3.6 14.6-2.9.8z"/></svg><span>Library</span></a>
    <a href="#/rate" data-tab="rate"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h3v-4H3zM8 20h3v-8H8zM13 20h3V8h-3zM18 20h3V4h-3z"/></svg><span>Rate</span></a>
    <a href="#/duel" data-tab="duel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h8v7H3zM13 13h8v7h-8z"/></svg><span>Duel</span><b id="duelBadge" class="badge" hidden>0</b></a>
    <a href="#/rankings" data-tab="rankings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 13h6v7h-6zM9 8h6v12H9zM15.5 11h6v9h-6z"/></svg><span>Rankings</span></a>
    <a href="#/settings" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l7.4 4.25v8.5L12 20.5l-7.4-4.25v-8.5z"/></svg><span>Settings</span></a>
  </nav>

  <div id="toast" class="toast" role="status"></div>
  <dialog id="sheet" class="sheet"></dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
